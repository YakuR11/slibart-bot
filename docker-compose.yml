# docker compose up -d --build   -> lance la base + le bot
# docker compose logs -f bot     -> voir les logs
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:-slip}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_USER: root
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro

volumes:
  db-data:
