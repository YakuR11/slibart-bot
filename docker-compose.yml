# docker compose up -d --build                    -> lance la base + le bot
# docker compose --profile tunnel up -d --build   -> pareil + le tunnel Cloudflare pour le Plinko
# docker compose logs -f bot                      -> voir les logs
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:-slip}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_USER: root
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
    ports:
      # page du Plinko accessible en local seulement (http://localhost:3001) ; Internet passe par le tunnel
      - "127.0.0.1:3001:3001"

  # Tunnel Cloudflare : rend le Plinko accessible en HTTPS sans ouvrir de port sur ta box
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on:
      - bot

volumes:
  db-data:
